spring.application.name=sns

# 시크릿(DB 계정, JWT 키)은 이 파일에 두지 않는다.
# 로컬: 프로젝트 루트의 secrets.properties에서 읽는다 (git 제외, secrets.properties.example 참고)
# 배포: 같은 이름의 환경변수(DB_PASSWORD 등)가 있으면 파일보다 우선 적용된다
spring.config.import=optional:file:./secrets.properties

spring.datasource.url=jdbc:mysql://localhost:3306/sns_db?serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.thymeleaf.cache=false

# HS256 서명 키 (32바이트 이상)
jwt.secret=${JWT_SECRET}

# 업로드 파일 저장 위치 (실행 디렉터리 기준 상대 경로)
file.upload-dir=uploads

# 업로드 파일 크기 제한
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
