spring.application.name=sns

# 시크릿(DB 계정, JWT 키)은 이 파일에 두지 않는다.
# 로컬: 프로젝트 루트의 secrets.properties에서 읽는다 (git 제외, secrets.properties.example 참고)
# 배포: 같은 이름의 환경변수(DB_PASSWORD 등)가 있으면 파일보다 우선 적용된다
spring.config.import=optional:file:./secrets.properties

spring.datasource.url=jdbc:mysql://localhost:3306/sns_db?serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.thymeleaf.cache=false

# HS256 서명 키 (32바이트 이상)
jwt.secret=${JWT_SECRET}

# 업로드 파일 저장 위치 (실행 디렉터리 기준 상대 경로)
file.upload-dir=uploads

# 업로드 파일 크기 제한
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# 알림 이벤트 Kafka. 로컬 브로커는 docker compose up -d로 띄운다(docker-compose.yml)
spring.kafka.bootstrap-servers=localhost:9092
# 복제본까지 적힌 뒤에 받았다고 답한다. 멱등 프로듀서는 프로듀서가 스스로 다시 보낼 때 생기는 중복과 순서 뒤집힘을 막는다
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
# 릴레이 한 차례가 ShedLock 잠금 시간(30초) 안에 끝나도록 기본값(60초, 120초)보다 줄였다. NotificationOutboxScheduler 참고
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000
# 소비자 그룹이 처음 붙을 때 토픽의 처음부터 읽는다. 기본값(latest)이면 그 전에 들어온 알림을 건너뛴다
spring.kafka.consumer.auto-offset-reset=earliest
