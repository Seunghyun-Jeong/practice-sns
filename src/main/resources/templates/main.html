<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Outplanetton</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<div style="height: 20px;"></div>

<!-- href는 JS가 없을 때의 대비. 평소에는 아래 스크립트가 클릭을 가로채 피드만 바꾼다. -->
<div class="feed-tabs" th:if="${username != null and tag == null}">
  <a href="/" class="feed-tab" data-tab="all" th:classappend="${tab != 'following'} ? 'active' : ''">전체</a>
  <a href="/?tab=following" class="feed-tab" data-tab="following" th:classappend="${tab == 'following'} ? 'active' : ''">팔로잉</a>
</div>

<!-- 해시태그로 걸러 보는 중 -->
<div class="tag-feed-header" th:if="${tag != null}">
  <div class="tag-feed-name" th:text="'#' + ${tag}">#태그</div>
  <a href="/" class="tag-feed-back">전체 피드로</a>
</div>

<div class="feed-container" id="feedContainer" th:attr="data-tab=${tab}, data-tag=${tag}, data-has-next=${hasNext}">
  <div th:if="${tag != null and #lists.isEmpty(posts)}" class="feed-empty">
    이 해시태그가 달린 게시글이 없습니다.
  </div>
  <div th:replace="~{fragments/postCards :: cards}"></div>
</div>

<div id="feedSentinel"></div>
<div id="feedLoading" class="feed-loading" style="display:none;">불러오는 중...</div>

<div id="postDetailModal" class="modal-backdrop" style="display:none;">
  <div id="modalContent"></div>
</div>

<!-- 댓글 수정 모달 -->
<div id="commentEditModal" class="ce-backdrop" style="display:none;">
  <div class="ce-box">
    <div class="ce-title">댓글 수정</div>
    <textarea id="commentEditInput" class="ce-input" rows="3"></textarea>
    <div class="ce-actions">
      <button id="commentEditCancel" class="ce-btn ce-cancel">취소</button>
      <button id="commentEditSave" class="ce-btn ce-save">저장</button>
    </div>
  </div>
</div>

<script src="/js/postCards.js"></script>
<script src="/js/postModal.js"></script>
<script>
  // 무한 스크롤 페이지는 브라우저의 스크롤 복원을 끈다.
  // 새로고침 시 브라우저가 이전 위치로 되돌리려 하는데, 첫 페이지만 그려진 짧은 문서라
  // 엉뚱한 중간 지점에 멈춰버린다. 항상 맨 위에서 시작하도록 직접 제어한다.
  if ('scrollRestoration' in history) {
    history.scrollRestoration = 'manual';
  }

  initPostCards(document);

  // 무한 스크롤과 탭 전환.
  // 둘 다 /feed 조각을 받아 카드를 채우는 일이라 한 클로저에서 같은 상태(page, hasNext, tab)를 다룬다.
  (function () {
    const container = document.getElementById('feedContainer');
    const sentinel = document.getElementById('feedSentinel');
    const loading = document.getElementById('feedLoading');
    if (!container || !sentinel) return;

    let page = 0;
    let hasNext = container.getAttribute('data-has-next') === 'true';
    let tab = container.getAttribute('data-tab') || 'all';
    const tag = container.getAttribute('data-tag') || '';
    let isLoading = false;

    // 탭을 바꿀 때마다 올라간다. 요청을 보낼 때 값을 잡아두고 응답이 왔을 때 달라져 있으면 버린다.
    // 이게 없으면 이전 탭의 다음 페이지나 먼저 누른 탭의 응답이 늦게 도착해 새 탭에 섞인다.
    let seq = 0;

    async function fetchFeed(pageNo) {
      const tagParam = tag ? '&tag=' + encodeURIComponent(tag) : '';
      const response = await fetch(`/feed?tab=${tab}${tagParam}&page=${pageNo}`, { credentials: 'include' });
      if (!response.ok) throw new Error('failed to load feed page');
      const temp = document.createElement('div');
      temp.innerHTML = await response.text();
      return temp;
    }

    async function loadNextPage() {
      if (isLoading || !hasNext) return;
      isLoading = true;
      loading.style.display = 'block';
      const mySeq = seq;

      try {
        const temp = await fetchFeed(page + 1);
        if (mySeq !== seq) return;

        const cards = [...temp.querySelectorAll('.post-summary')];
        if (cards.length === 0) {
          hasNext = false;
          return;
        }

        // 이벤트는 새 카드에만 연결한다 (붙이기 전에 연결해도 이동 후 그대로 유지됨)
        initPostCards(temp);
        cards.forEach(card => container.appendChild(card));

        page += 1;
        const meta = temp.querySelector('.feed-page-meta');
        hasNext = meta ? meta.getAttribute('data-has-next') === 'true' : false;
      } catch (err) {
        console.error(err);
        if (mySeq === seq) hasNext = false;
      } finally {
        if (mySeq === seq) {
          isLoading = false;
          loading.style.display = 'none';
        }
      }
    }

    // 피드 컨테이너만 첫 페이지로 갈아 끼운다. 페이지 전체를 다시 불러오지 않는다.
    async function switchTab(nextTab, pushHistory) {
      if (nextTab === tab) return;
      seq += 1;
      const mySeq = seq;
      tab = nextTab;
      page = 0;
      hasNext = false;
      isLoading = true;
      loading.style.display = 'block';

      document.querySelectorAll('.feed-tab').forEach(el => {
        el.classList.toggle('active', el.getAttribute('data-tab') === nextTab);
      });
      if (pushHistory) {
        history.pushState({ tab: nextTab }, '', nextTab === 'following' ? '/?tab=following' : '/');
      }
      window.scrollTo(0, 0);
      // 스크롤을 코드로 되돌린 것이라 배경 별은 따라오지 않게 한다
      if (window.starfieldRebase) window.starfieldRebase();

      try {
        const temp = await fetchFeed(0);
        if (mySeq !== seq) return;

        initPostCards(temp);
        container.replaceChildren(...temp.childNodes);
        const meta = container.querySelector('.feed-page-meta');
        hasNext = meta ? meta.getAttribute('data-has-next') === 'true' : false;
      } catch (err) {
        console.error(err);
        if (mySeq === seq) showToast('피드를 불러오지 못했습니다.', 'error');
      } finally {
        if (mySeq === seq) {
          isLoading = false;
          loading.style.display = 'none';
          checkNearBottom();   // 새 첫 페이지가 짧으면 바로 다음 페이지를 채운다
        }
      }
    }

    document.querySelectorAll('.feed-tab[data-tab]').forEach(el => {
      el.addEventListener('click', (e) => {
        e.preventDefault();
        switchTab(el.getAttribute('data-tab'), true);
      });
    });

    // 뒤로 가기/앞으로 가기도 리로드 없이 같은 경로로 처리한다
    window.addEventListener('popstate', () => {
      const wanted = new URLSearchParams(location.search).get('tab') === 'following' ? 'following' : 'all';
      switchTab(wanted, false);
    });

    const observer = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting) loadNextPage();
    }, { rootMargin: '200px' });

    observer.observe(sentinel);

    // 폴백: 스크롤이 바닥 근처에 닿으면 불러온다.
    // (렌더링이 지연되는 환경에서 옵저버 콜백이 오지 않는 경우 대비)
    function checkNearBottom() {
      if (!hasNext || isLoading) return;
      const remaining = document.documentElement.scrollHeight - (window.scrollY + window.innerHeight);
      if (remaining < 300) loadNextPage();
    }

    window.addEventListener('scroll', checkNearBottom, { passive: true });
    window.addEventListener('resize', checkNearBottom);
    checkNearBottom();   // 첫 화면이 짧아 스크롤이 없을 때도 채운다
  })();

</script>
</body>
</html>
