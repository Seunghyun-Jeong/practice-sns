<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  게시글 상세의 댓글 묶음.
  모달을 처음 열 때, 스크롤로 다음 묶음을 받을 때, 답글을 펼칠 때, 방금 쓴 댓글을 붙일 때 모두 이 조각을 쓴다.
  처음 그리는 쪽과 이어 붙이는 쪽을 따로 만들면 한쪽만 고쳐져서 어긋나기 때문이다.
  postId, currentUserId, currentUserRole 은 모델에서 읽는다.
-->

<!--
  원 댓글 하나와 그 답글 자리.
  답글은 접어 두고, 펼칠 때 불러와 .comment-replies 에 넣는다.
  답글 버튼의 글자는 펼침 상태와 남은 수에 따라 바뀌므로 postModal.js 가 채운다.
-->
<div th:fragment="thread(comment)" class="comment-thread"
     th:attr="data-comment-id=${comment.id}, data-reply-count=${comment.replyCount}">
    <div th:replace="~{fragments/commentRow :: commentRow(${comment}, ${postId}, ${currentUserId}, ${currentUserRole}, false)}"></div>
    <div class="comment-replies"></div>
    <button type="button" class="reply-toggle-btn" th:hidden="${comment.replyCount == 0}"></button>
</div>

<!-- 원 댓글 한 묶음. 다음 묶음이 있는지는 끝의 표시로 알려 준다 (화면에는 보이지 않음) -->
<th:block th:fragment="threadPage">
    <th:block th:each="comment : ${comments}">
        <div th:replace="~{fragments/commentThreads :: thread(${comment})}"></div>
    </th:block>
    <div class="comment-page-meta" th:attr="data-has-next=${hasNext}" hidden></div>
</th:block>

<!-- 한 원 댓글의 답글 한 묶음 -->
<th:block th:fragment="replyPage">
    <th:block th:each="reply : ${comments}">
        <div th:replace="~{fragments/commentRow :: commentRow(${reply}, ${postId}, ${currentUserId}, ${currentUserRole}, true)}"></div>
    </th:block>
    <div class="comment-page-meta" th:attr="data-has-next=${hasNext}" hidden></div>
</th:block>

<!-- 방금 쓴 댓글 하나. 원 댓글이면 답글 자리까지, 답글이면 한 줄만 -->
<!-- 조건과 조각 불러오기도 같은 태그에 두면 안 된다. th:replace 가 th:if 보다 먼저 처리된다 -->
<th:block th:fragment="newComment">
    <th:block th:if="${comment.parentId == null}">
        <div th:replace="~{fragments/commentThreads :: thread(${comment})}"></div>
    </th:block>
    <th:block th:unless="${comment.parentId == null}">
        <div th:replace="~{fragments/commentRow :: commentRow(${comment}, ${postId}, ${currentUserId}, ${currentUserRole}, true)}"></div>
    </th:block>
</th:block>
</body>
</html>
