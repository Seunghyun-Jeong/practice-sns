<div th:fragment="header" class="header-wrap">
  <div class="header-frost"></div>
  <div class="header-bar">
    <div class="logo">
      <a href="/" class="logo-link">Outplanetton</a>
    </div>

    <!-- 검색 -->
    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" placeholder="검색" autocomplete="off" />
      <div id="searchDropdown" class="search-dropdown" style="display:none;"></div>
    </div>

    <div class="user-info">
      <!-- 메시지 -->
      <a href="/chat" class="noti-btn chat-header-link" th:if="${username != null}" aria-label="메시지">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/>
          <path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/>
          <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/>
          <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>
        </svg>
        <span id="chatBadge" class="noti-badge" style="display:none;">0</span>
      </a>

      <!-- 알림 -->
      <div class="noti-menu" th:if="${username != null}">
        <button id="notiBtn" class="noti-btn" aria-label="알림">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
          <span id="notiBadge" class="noti-badge" style="display:none;">0</span>
        </button>

        <div id="notiDropdown" class="noti-dropdown" style="display:none;">
          <div class="noti-header">알림</div>
          <div id="notiList" class="noti-list"></div>
        </div>
      </div>

      <span th:if="${username != null}">
        <a th:href="@{'/profile/' + ${userId}}" class="username" th:text="${username}"></a>
        <button id="logoutBtn" class="btn logout-btn">로그아웃</button>
      </span>

      <span th:if="${username == null}">
        <a href="/login"><button class="btn login-btn">로그인</button></a>
      </span>

      <div class="hamburger-menu">
        <button id="hamburgerBtn" aria-label="메뉴">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <div id="dropdownMenu" class="dropdown-content" style="display: none;">
          <a th:if="${username != null}" href="/post"><button class="btn write-btn">게시글 작성</button></a>
          <a th:if="${username != null and userRole == 'ADMIN'}" href="/admin/suspended-users"><button class="btn">정지 유저 목록</button></a>
          <button th:if="${username != null}" id="deleteAccountBtn" class="btn delete-btn">회원탈퇴</button>

          <a th:if="${username == null}" href="/signup"><button class="btn signup-btn">회원가입</button></a>
        </div>
      </div>
    </div>
  </div>
  <script src="/js/notify.js"></script>
  <script src="/js/header.js"></script>
  <script src="/js/notification.js?v=2"></script>
  <script src="/js/chat.js?v=8"></script>
  <script src="/js/search.js"></script>
  <script src="/js/hashtag.js"></script>
</div>
