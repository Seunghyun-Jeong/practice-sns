<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  피드의 게시글 카드 목록.
  첫 페이지(main.html)와 무한 스크롤로 불러오는 다음 페이지가 같은 마크업을 쓴다.
-->
<th:block th:fragment="cards">
  <!-- 무한 스크롤이 다음 페이지 존재 여부를 읽어가는 표시 (화면에는 보이지 않음) -->
  <div class="feed-page-meta" th:attr="data-has-next=${hasNext}" style="display:none;"></div>

  <div th:each="post : ${posts}" class="post-summary"
       th:onclick="'openPostModal(' + ${post.id} + ')'"
       style="cursor:pointer;">

    <img th:if="${post.imageUrl != null}" th:src="${post.imageUrl}" class="post-image" alt="게시물 이미지" />

    <div class="post-actions">
      <span class="feed-like-btn icon-btn" th:classappend="${post.likedByCurrentUser} ? 'liked' : ''" th:attr="data-post-id=${post.id}">
        <svg class="ic-heart" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      </span>
      <span class="post-action-count feed-like-count" th:text="${post.likeCount}">0</span>
      <span class="icon-btn post-comment-ic">
        <svg class="ic-comment" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      </span>
      <span class="post-action-count" th:text="${post.commentCount}">0</span>
    </div>

    <div class="post-caption">
      <span class="post-author-name" th:text="${post.author}" th:attr="data-author-id=${post.authorId}">닉네임</span>
      <span class="post-caption-text" th:text="${post.content}">내용</span>
    </div>

    <div class="post-time" th:attr="data-time=${post.createdAt}"></div>

  </div>
</th:block>
</body>
</html>
