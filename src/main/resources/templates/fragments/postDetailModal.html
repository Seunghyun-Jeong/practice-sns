<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="modalContent">
<div class="modal" id="postDetailBox">
    <input type="hidden" id="currentUsername" th:value="${currentUsername}" />
    <input type="hidden" id="currentUserRole" th:value="${currentUserRole}" />

    <div class="modal-content" th:attr="data-post-id=${post.id}">
        <div class="post-detail-left">
            <div th:if="${post.suspended}" class="suspended-notice"
                 style="padding: 60px 20px; text-align: center; color: #888; font-size: 1.2em;">
                이용이 정지된 유저입니다.
            </div>

            <div th:unless="${post.suspended}">
                <img th:if="${post.imageUrl != null}" th:src="${post.imageUrl}" class="post-detail-image" alt="게시물 이미지" />

                <div class="detail-caption">
                    <span class="author-name detail-author"
                          th:text="${post.author}"
                          th:attr="data-author-id=${post.authorId}">작성자</span>
                    <span class="post-content" th:text="${post.content}">내용</span>
                </div>
                <textarea class="edit-content-input" style="display:none; width: 100%; height: 120px; padding: 8px; margin-top: 10px;">[[${post.content}]]</textarea>

                <div class="detail-time"><span class="post-time" th:attr="data-time=${post.createdAt}"></span><span th:if="${post.updatedAt != null}"> (수정됨)</span></div>

                <div th:if="${post.authorId == currentUserId or currentUserRole == 'ADMIN'}" class="post-edit-actions">
                    <button th:if="${post.authorId == currentUserId}" class="edit-post-btn" th:attr="data-post-id=${post.id}">수정</button>
                    <button th:if="${post.authorId == currentUserId}" class="save-post-btn" th:attr="data-post-id=${post.id}" style="display:none;">저장</button>
                    <button class="delete-post-btn" th:attr="data-post-id=${post.id}">삭제</button>
                </div>
            </div>
        </div>

        <div class="post-detail-right" th:unless="${post.suspended}">
            <div class="post-stats">
                <span id="likeIcon" class="like-icon like-btn icon-btn"
                      th:classappend="${post.likedByCurrentUser} ? 'liked' : ''"
                      th:attr="data-post-id=${post.id}">
                    <svg class="ic-heart" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                </span>
                <span class="like-count" th:text="${post.likeCount}">0</span>

                <span class="comment-icon icon-btn" style="cursor: default;">
                    <svg class="ic-comment" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
                </span>
                <span class="comment-count" th:text="${post.commentCount}">0</span>
            </div>

            <div class="comment-list">
                <div th:each="comment : ${post.comments}"
                     class="comment"
                     th:attr="data-comment-id=${comment.id}, data-author=${comment.author}">

                    <div th:if="${comment.suspended}" class="comment-suspended"
                         style="color: #888; font-style: italic; padding: 6px 0;">
                        이용이 정지된 유저의 댓글입니다.
                    </div>

                    <div th:unless="${comment.suspended}">
                        <div class="comment-author" th:text="${comment.author}"
                             th:attr="data-author-id=${comment.authorId}"
                             style="cursor: pointer;">댓글 작성자</div>

                        <div class="comment-text" th:text="${comment.content}"></div>

                        <div class="edit-comment-form" style="display: none;">
                            <input type="text" class="edit-comment-input" th:value="${comment.content}" />
                            <button class="save-comment-btn" th:attr="data-post-id=${post.id}" style="display:none;">저장</button>
                            <button class="cancel-edit-btn" style="display:none;">취소</button>
                        </div>

                        <div class="comment-date"><span class="post-time" th:attr="data-time=${comment.createdAt}"></span><span th:if="${comment.updatedAt != null}"> (수정됨)</span></div>

                        <div class="comment-actions">
                            <span class="comment-like-btn icon-btn"
                                  th:classappend="${comment.likedByCurrentUser} ? 'liked' : ''"
                                  th:attr="data-post-id=${post.id}, data-comment-id=${comment.id}">
                                <svg class="ic-heart" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                            </span>
                            <span class="comment-like-count" th:text="${comment.likeCount}">0</span>
                            <span class="comment-action-btns">
                                <button class="edit-comment-btn" th:if="${comment.authorId == currentUserId}">수정</button>
                                <button class="delete-comment-btn"
                                        th:if="${comment.authorId == currentUserId or currentUserRole == 'ADMIN'}"
                                        th:attr="data-post-id=${post.id}, data-comment-id=${comment.id}">삭제</button>
                            </span>
                        </div>
                    </div>

                </div>
            </div>

            <div class="comment-form">
                <div class="comment-input-wrapper">
                    <input type="text" id="commentInput" placeholder="댓글을 입력하세요" />
                    <button id="submitCommentBtn" class="comment-submit-button" th:attr="data-post-id=${post.id}">등록</button>
                </div>
            </div>
        </div>
    </div>
</div>
</html>
