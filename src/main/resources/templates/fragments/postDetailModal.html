<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="modalContent">
<div class="modal" id="postDetailBox">
    <input type="hidden" id="currentUsername" th:value="${currentUsername}" />
    <input type="hidden" id="currentUserRole" th:value="${currentUserRole}" />

    <div class="modal-content" th:attr="data-post-id=${post.id}">

        <!-- 왼쪽: 이미지 전용 -->
        <div class="post-detail-media">
            <div th:if="${post.suspended}" class="suspended-notice"
                 style="color:#aaa; text-align:center; padding:0 20px;">
                이용이 정지된 유저입니다.
            </div>
            <img th:unless="${post.suspended}" th:if="${post.imageUrl != null}"
                 th:src="${post.imageUrl}" class="post-detail-image" alt="게시물 이미지" />
        </div>

        <!-- 오른쪽 -->
        <div class="post-detail-side" th:unless="${post.suspended}">

            <!-- 헤더: 프사 + 아이디 + ...메뉴 -->
            <div class="pd-header">
                <img class="pd-avatar"
                     th:src="${post.authorProfileImageUrl != null ? post.authorProfileImageUrl : '/images/default-profile.svg'}"
                     alt="프로필" />
                <span class="author-name pd-username" th:text="${post.author}"
                      th:attr="data-author-id=${post.authorId}">작성자</span>

                <div class="pd-menu" th:if="${post.authorId == currentUserId or currentUserRole == 'ADMIN'}">
                    <button type="button" class="pd-menu-btn" aria-label="더보기">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
                    </button>
                    <div class="pd-menu-dropdown" style="display:none;">
                        <button th:if="${post.authorId == currentUserId}" class="btn edit-post-btn" th:attr="data-post-id=${post.id}">수정</button>
                        <button class="btn delete-post-btn" th:attr="data-post-id=${post.id}">삭제</button>
                    </div>
                </div>
            </div>

            <!-- 본문: 캡션(첫 댓글처럼) + 댓글 목록 -->
            <div class="pd-body">
                <!-- 캡션 -->
                <div class="pd-row pd-caption-row">
                    <img class="pd-avatar-sm"
                         th:src="${post.authorProfileImageUrl != null ? post.authorProfileImageUrl : '/images/default-profile.svg'}"
                         alt="프로필" />
                    <div class="pd-row-content">
                        <div class="pd-row-text">
                            <span class="author-name pd-username-inline" th:text="${post.author}"
                                  th:attr="data-author-id=${post.authorId}">작성자</span>
                            <span class="post-content" th:text="${post.content}">내용</span>
                        </div>
                        <textarea class="edit-content-input" style="display:none;">[[${post.content}]]</textarea>
                        <button class="save-post-btn" th:attr="data-post-id=${post.id}" style="display:none;">저장</button>
                        <div class="pd-meta">
                            <span class="post-time" th:attr="data-time=${post.createdAt}"></span>
                            <span th:if="${post.updatedAt != null}"> (수정됨)</span>
                        </div>
                    </div>
                </div>

                <!-- 댓글 -->
                <div class="comment-list">
                    <div th:each="comment : ${post.comments}" class="comment-thread">

                        <!-- 원 댓글 -->
                        <div th:replace="~{fragments/commentRow :: commentRow(${comment}, ${post.id}, ${currentUserId}, ${currentUserRole}, false)}"></div>

                        <!--
                          답글 (한 단만 들어간다).
                          반복과 조각 불러오기를 같은 태그에 두면 안 된다. th:replace 가 th:each 보다
                          먼저 처리되어서, 반복 변수가 아직 없는 채로 조각이 불려간다.
                        -->
                        <div class="comment-replies" th:if="${!comment.replies.isEmpty()}">
                            <div th:each="reply : ${comment.replies}">
                                <div th:replace="~{fragments/commentRow :: commentRow(${reply}, ${post.id}, ${currentUserId}, ${currentUserRole}, true)}"></div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>

            <!-- 하단 액션바: (하트) N (말풍선) N -->
            <div class="pd-actions">
                <span id="likeIcon" class="like-btn icon-btn"
                      th:classappend="${post.likedByCurrentUser} ? 'liked' : ''"
                      th:attr="data-post-id=${post.id}">
                    <svg class="ic-heart" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                </span>
                <span class="pd-count"><span class="like-count" th:text="${post.likeCount}">0</span></span>
                <span class="pd-action-ic pd-comment-ic" id="pdCommentFocus" role="button" aria-label="댓글">
                    <svg class="ic-comment" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
                </span>
                <span class="pd-count"><span class="comment-count" th:text="${post.commentCount}">0</span></span>
            </div>

            <!-- 게시 시간 -->
            <div class="pd-posttime"><span class="post-time" th:attr="data-time=${post.createdAt}"></span></div>

            <!-- 댓글 입력 -->
            <div class="comment-form">
                <!--
                  답글을 쓰는 중이라는 표시.
                  자리는 항상 잡아두고 보이기만 바꾼다. 입력창이 위아래로 흔들리지 않게 하기 위해서다.
                -->
                <div class="reply-target" id="replyTarget" style="visibility:hidden;">
                    <span id="replyTargetText"></span>
                    <button type="button" id="replyCancelBtn" aria-label="답글 취소">취소</button>
                </div>
                <div class="comment-input-wrapper">
                    <input type="text" id="commentInput" placeholder="댓글 달기..." />
                    <input type="hidden" id="replyParentId" value="" />
                    <button id="submitCommentBtn" class="comment-submit-button" th:attr="data-post-id=${post.id}">게시</button>
                </div>
            </div>
        </div>
    </div>
</div>

</html>
