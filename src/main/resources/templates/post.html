<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>게시글 등록</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}" />
</head>
<body>
<h2>게시글 등록</h2>

<form id="postForm">
    <textarea id="content" name="content" rows="5" placeholder="내용을 입력하세요" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 15px;" required></textarea>

    <button type="submit">등록하기</button>
</form>

<script>
    document.getElementById("postForm").addEventListener("submit", function (e) {
        e.preventDefault();

        const content = document.getElementById("content").value;

        fetch("/api/posts", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            credentials: "include",
            body: JSON.stringify({ content })
        })
            .then(async response => {
                if (response.status === 401) {
                    alert("로그인이 필요합니다.");
                    window.location.href = "/login";
                    return;
                }
                const data = await response.json();
                if (response.ok) {
                    alert("게시글이 등록되었습니다!");
                    window.location.href = "/";
                } else {
                    alert(data.message || "게시글 등록에 실패했습니다.");
                }
            })
            .catch(error => {
                console.error("게시글 등록 실패:", error);
                alert("서버 오류로 인해 게시글 등록에 실패했습니다.");
            });
    });
</script>
</body>
</html>
