<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Outplanetton</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}" />
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="post-create-container">
    <h2 class="post-create-title">새 게시물</h2>

    <input type="file" id="postImageInput" accept="image/*" style="display: none;" />

    <!-- 1. 사진 선택 영역 -->
    <div id="imageSelectArea" class="image-select-area">
        <img id="imagePreview" class="image-preview" style="display: none;" alt="미리보기" />
        <div id="imagePlaceholder" class="image-placeholder">
            <span class="image-placeholder-icon">＋</span>
            <span>사진 선택</span>
            <small>게시물에 넣을 사진을 선택하세요</small>
        </div>
    </div>

    <!-- 2. 내용 작성 -->
    <textarea id="content" rows="4" placeholder="문구를 입력하세요..." required></textarea>

    <!-- 3. 업로드 -->
    <button type="button" id="submitPostBtn" class="btn login-btn post-upload-btn">업로드</button>
</div>

<script>
    const fileInput = document.getElementById('postImageInput');
    const selectArea = document.getElementById('imageSelectArea');
    const preview = document.getElementById('imagePreview');
    const placeholder = document.getElementById('imagePlaceholder');

    // 사진 영역 클릭 → 파일 선택창
    selectArea.addEventListener('click', () => fileInput.click());

    // 파일 선택 → 미리보기
    fileInput.addEventListener('change', () => {
        const file = fileInput.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = e => {
            preview.src = e.target.result;
            preview.style.display = 'block';
            placeholder.style.display = 'none';
        };
        reader.readAsDataURL(file);
    });

    // 업로드
    document.getElementById('submitPostBtn').addEventListener('click', async () => {
        if (!fileInput.files[0]) {
            alert('사진을 선택해주세요.');
            return;
        }

        const content = document.getElementById('content').value.trim();
        if (!content) {
            alert('문구를 입력해주세요.');
            return;
        }

        const formData = new FormData();
        formData.append('content', content);
        formData.append('image', fileInput.files[0]);

        try {
            const response = await fetch('/api/posts', {
                method: 'POST',
                credentials: 'include',
                body: formData
            });

            if (response.status === 401) {
                alert('로그인이 필요합니다.');
                window.location.href = '/login';
                return;
            }

            const data = await response.json();
            if (response.ok) {
                alert('게시글이 등록되었습니다!');
                window.location.href = '/';
            } else {
                alert(data.message || '게시글 등록에 실패했습니다.');
            }
        } catch (error) {
            console.error('게시글 등록 실패:', error);
            alert('서버 오류로 게시글 등록에 실패했습니다.');
        }
    });

    // 헤더 햄버거 / 로그아웃 / 회원탈퇴
    const hamburgerBtn = document.getElementById('hamburgerBtn');
    const dropdownMenu = document.getElementById('dropdownMenu');
    hamburgerBtn?.addEventListener('click', () => {
        dropdownMenu.style.display = dropdownMenu.style.display === 'block' ? 'none' : 'block';
    });
    document.getElementById('logoutBtn')?.addEventListener('click', () => {
        fetch('/api/users/logout', { method: 'POST', credentials: 'include' })
            .then(() => window.location.href = '/');
    });
    document.getElementById('deleteAccountBtn')?.addEventListener('click', async () => {
        if (!confirm('정말로 회원 탈퇴하시겠습니까?')) return;
        const r = await fetch('/api/users/me', { method: 'DELETE', credentials: 'include' });
        if (r.ok) { alert('회원 탈퇴가 완료되었습니다.'); window.location.href = '/login'; }
    });
</script>
</body>
</html>
