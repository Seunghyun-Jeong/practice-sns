# 테스트 전용 설정.
# 실서비스 DB(sns_db)를 건드리지 않도록 메모리 DB를 따로 쓴다.
# NON_KEYWORDS=USER : H2에서는 user 가 예약어라 테이블명으로 쓸 수 없다.
# 운영 스키마(MySQL)는 user 테이블을 쓰므로, 테스트에서만 예약어에서 빼준다.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# 테스트마다 스키마를 새로 만들고 끝나면 버린다
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

jwt.secret=testsecrettestsecrettestsecrettestsecret
file.upload-dir=build/test-uploads
