# 테스트 전용 설정.
# 실서비스 DB(sns_db)를 건드리지 않도록 메모리 DB를 따로 쓴다.
# NON_KEYWORDS=USER : H2에서는 user 가 예약어라 테이블명으로 쓸 수 없다.
# 운영 스키마(MySQL)는 user 테이블을 쓰므로, 테스트에서만 예약어에서 빼준다.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# 테스트마다 스키마를 새로 만들고 끝나면 버린다
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

jwt.secret=testsecrettestsecrettestsecrettestsecret
file.upload-dir=build/test-uploads

# 전체 피드의 가장 최근 글을 기억하지 않는다. 테스트끼리 데이터는 되돌려도 기억한 값은 남아서 서로 섞인다.
# 기억하는 동작 자체는 LatestFeedPostTest에서 시계를 직접 넘겨 확인한다.
feed.latest-cache-ttl=0s

# 알림 Outbox 릴레이를 스케줄러로 돌리지 않는다. 테스트 도중에 끼어들면 결과가 흔들린다.
# 릴레이 동작은 NotificationOutboxTest에서 직접 불러 확인한다.
notification.outbox.relay.enabled=false

# Kafka는 NotificationOutboxTest만 내장 브로커(@EmbeddedKafka)로 쓴다.
# 나머지 테스트는 브로커가 없으니 소비자를 띄우지 않는다.
spring.kafka.listener.auto-startup=false
